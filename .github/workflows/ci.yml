name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci, not install: fails on a lockfile that doesn't match package.json
      # rather than quietly resolving something different from production.
      #
      # The overrides in package.json are what make this work across platforms.
      # Tailwind's optional @napi-rs/wasm-runtime asks for @emnapi 2.0.0-alpha
      # while the rest of the tree is on 1.x; that package is a wasm fallback,
      # never loaded when the native oxide binary exists, so pinning it to 1.x
      # is safe and lets one lockfile satisfy both linux-x64 and darwin-arm64.
      - run: npm ci

      # Next 16 no longer lints during `next build`, so this must run on its own.
      - run: npm run lint

      # No secrets are set here on purpose. The build must succeed without
      # Supabase credentials — the app is written to degrade rather than crash
      # when they're absent, and this is what proves it stays that way.
      - run: npm run build
