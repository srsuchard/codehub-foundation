name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` would be stricter, but this lockfile is written on macOS where
      # Tailwind's optional @napi-rs/wasm-runtime is skipped. On Linux npm
      # resolves it and its @emnapi/picomatch requirements contradict the
      # pinned versions, so `npm ci` refuses to install. `npm install` resolves
      # per-platform and works. The trade: CI may use slightly different
      # transitive versions than the lockfile records.
      - run: npm install --no-audit --no-fund

      # Next 16 no longer lints during `next build`, so this must run on its own.
      - run: npm run lint

      # No secrets are set here on purpose. The build must succeed without
      # Supabase credentials — the app is written to degrade rather than crash
      # when they're absent, and this is what proves it stays that way.
      - run: npm run build
